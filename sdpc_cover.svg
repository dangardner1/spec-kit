<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="linen" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="soft-light"/>
    </filter>
  </defs>

  <!-- FRONT COVER -->
  <rect x="0" y="0" width="624" height="620" fill="#1B2A4A"/>
  <rect x="0" y="0" width="624" height="620" fill="#1B2A4A" filter="url(#linen)" opacity="0.6"/>
  <rect x="20" y="20" width="584" height="580" fill="none" stroke="#FDFBF7" stroke-width="0.5" opacity="0.18"/>

  <!-- LOGO — ivory single-tone, vertically centered with title block -->
  <g transform="translate(44, 192) scale(1.28)" opacity="0.88">
    <!-- Outer dark crescent -->
    <circle cx="44" cy="44" r="42" fill="#FDFBF7" opacity="0.25"/>
    <circle cx="57" cy="44" r="33" fill="#1B2A4A"/>
    <!-- Mid crescent -->
    <circle cx="52" cy="44" r="36" fill="#FDFBF7" opacity="0.45"/>
    <circle cx="64" cy="44" r="26" fill="#1B2A4A"/>
    <!-- Thin teal ring — ivory tint -->
    <circle cx="60" cy="44" r="28" fill="#FDFBF7" opacity="0.6"/>
    <circle cx="64" cy="44" r="23" fill="#1B2A4A"/>
    <!-- Inner filled circle -->
    <circle cx="63" cy="44" r="21" fill="#FDFBF7" opacity="0.82"/>
  </g>

  <!-- Thin vertical separator between logo and text -->
  <line x1="172" y1="185" x2="172" y2="340" stroke="#FDFBF7" stroke-width="0.5" opacity="0.2"/>

  <!-- TITLE BLOCK -->
  <text x="190" y="210" fill="#FDFBF7" font-size="11" letter-spacing="5" font-family="Georgia, serif" opacity="0.55">HISTORY OF THE</text>

  <!-- Institutional name — dominant -->
  <text x="188" y="248" fill="#FDFBF7" font-size="28" font-weight="bold" letter-spacing="3" font-family="Georgia, serif" opacity="0.97">SAN DIEGO</text>
  <text x="188" y="285" fill="#FDFBF7" font-size="28" font-weight="bold" letter-spacing="3" font-family="Georgia, serif" opacity="0.97">PSYCHOANALYTIC</text>
  <text x="188" y="322" fill="#FDFBF7" font-size="28" font-weight="bold" letter-spacing="3" font-family="Georgia, serif" opacity="0.97">CENTER</text>

  <!-- Primary divider rule -->
  <line x1="44" y1="355" x2="580" y2="355" stroke="#FDFBF7" stroke-width="0.7" opacity="0.7"/>

  <!-- Subtitle -->
  <text x="44" y="382" fill="#FDFBF7" font-size="9.5" letter-spacing="3.5" font-family="Arial, sans-serif" opacity="0.65">A HALF-CENTURY OF CLINICAL, ACADEMIC, AND COMMUNITY LEADERSHIP</text>

  <!-- Year range -->
  <text x="44" y="430" fill="#FDFBF7" font-size="18" letter-spacing="8" font-family="Georgia, serif" opacity="0.35">1970</text>
  <line x1="116" y1="424" x2="160" y2="424" stroke="#FDFBF7" stroke-width="0.6" opacity="0.25"/>
  <text x="168" y="430" fill="#FDFBF7" font-size="18" letter-spacing="8" font-family="Georgia, serif" opacity="0.35">2026</text>

  <!-- Second thin rule -->
  <line x1="44" y1="460" x2="300" y2="460" stroke="#FDFBF7" stroke-width="0.4" opacity="0.15"/>

  <!-- SPINE -->
  <rect x="624" y="0" width="38" height="620" fill="#121e30"/>
  <rect x="624" y="0" width="38" height="620" fill="#121e30" filter="url(#linen)" opacity="0.5"/>
  <line x1="625" y1="0" x2="625" y2="620" stroke="#FDFBF7" stroke-width="0.4" opacity="0.2"/>
  <line x1="661" y1="0" x2="661" y2="620" stroke="#FDFBF7" stroke-width="0.4" opacity="0.2"/>
  <text transform="translate(643,590) rotate(-90)" fill="#FDFBF7" font-size="8.5" letter-spacing="3" text-anchor="start" font-family="Arial, sans-serif" opacity="0.7">SAN DIEGO PSYCHOANALYTIC CENTER  •  1970–2026</text>

  <!-- BACK COVER -->
  <rect x="662" y="0" width="238" height="620" fill="#1B2A4A"/>
  <rect x="662" y="0" width="238" height="620" fill="#1B2A4A" filter="url(#linen)" opacity="0.6"/>
  <rect x="676" y="20" width="210" height="580" fill="none" stroke="#FDFBF7" stroke-width="0.5" opacity="0.18"/>

  <!-- Decorative large open-quote -->
  <text x="781" y="185" fill="#FDFBF7" font-size="64" text-anchor="middle" font-family="Georgia, serif" opacity="0.07">&#x201C;</text>

  <!-- Pull quote -->
  <text fill="#FDFBF7" font-size="9.5" text-anchor="middle" font-style="italic" font-family="Georgia, serif" opacity="0.72">
    <tspan x="781" y="208">&#x201C;We are held together by a shared</tspan>
    <tspan x="781" dy="18">sense of purpose, as well as a</tspan>
    <tspan x="781" dy="18">shared sense of humor&#x2026; ensuring</tspan>
    <tspan x="781" dy="18">that while we take our mission</tspan>
    <tspan x="781" dy="18">seriously, we never take ourselves</tspan>
    <tspan x="781" dy="18">too seriously.&#x201D;</tspan>
  </text>

  <!-- Rule below quote -->
  <line x1="706" y1="326" x2="856" y2="326" stroke="#FDFBF7" stroke-width="0.5" opacity="0.25"/>

  <!-- URL -->
  <text x="781" y="568" fill="#FDFBF7" font-size="8" text-anchor="middle" letter-spacing="2.5" font-family="Arial, sans-serif" opacity="0.35">sdpsychoanalyticcenter.org</text>
</svg>
