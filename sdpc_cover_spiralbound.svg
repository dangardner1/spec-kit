<svg viewBox="0 0 850 1100" xmlns="http://www.w3.org/2000/svg" width="850" height="1100">
  <defs>
    <filter id="linen" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="soft-light"/>
    </filter>
  </defs>

  <!-- ── FULL COVER BACKGROUND ── -->
  <rect x="0" y="0" width="850" height="1100" fill="#1B2A4A"/>
  <rect x="0" y="0" width="850" height="1100" fill="#1B2A4A" filter="url(#linen)" opacity="0.55"/>

  <!-- ── SPIRAL BINDING ZONE (left 62px) ── -->
  <!-- Slightly darker channel to suggest bound edge -->
  <rect x="0" y="0" width="62" height="1100" fill="#121e30" opacity="0.6"/>
  <!-- Vertical guide lines on binding channel -->
  <line x1="61" y1="0" x2="61" y2="1100" stroke="#FDFBF7" stroke-width="0.5" opacity="0.15"/>

  <!-- Spiral coil holes — evenly spaced down the left channel -->
  <!-- 18 holes, starting y=55, spacing=56 -->
  <g fill="none" stroke="#FDFBF7" stroke-width="1.2" opacity="0.5">
    <!-- Outer oval (coil loop) -->
    <ellipse cx="31" cy="55"   rx="13" ry="9"/>
    <ellipse cx="31" cy="111"  rx="13" ry="9"/>
    <ellipse cx="31" cy="167"  rx="13" ry="9"/>
    <ellipse cx="31" cy="223"  rx="13" ry="9"/>
    <ellipse cx="31" cy="279"  rx="13" ry="9"/>
    <ellipse cx="31" cy="335"  rx="13" ry="9"/>
    <ellipse cx="31" cy="391"  rx="13" ry="9"/>
    <ellipse cx="31" cy="447"  rx="13" ry="9"/>
    <ellipse cx="31" cy="503"  rx="13" ry="9"/>
    <ellipse cx="31" cy="559"  rx="13" ry="9"/>
    <ellipse cx="31" cy="615"  rx="13" ry="9"/>
    <ellipse cx="31" cy="671"  rx="13" ry="9"/>
    <ellipse cx="31" cy="727"  rx="13" ry="9"/>
    <ellipse cx="31" cy="783"  rx="13" ry="9"/>
    <ellipse cx="31" cy="839"  rx="13" ry="9"/>
    <ellipse cx="31" cy="895"  rx="13" ry="9"/>
    <ellipse cx="31" cy="951"  rx="13" ry="9"/>
    <ellipse cx="31" cy="1007" rx="13" ry="9"/>
    <ellipse cx="31" cy="1063" rx="13" ry="9"/>
  </g>
  <!-- Punch holes (dark filled) -->
  <g fill="#0d1520">
    <ellipse cx="31" cy="55"   rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="111"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="167"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="223"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="279"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="335"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="391"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="447"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="503"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="559"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="615"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="671"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="727"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="783"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="839"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="895"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="951"  rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="1007" rx="7"  ry="5.5"/>
    <ellipse cx="31" cy="1063" rx="7"  ry="5.5"/>
  </g>

  <!-- ── CONTENT AREA BORDER (inset from right/top/bottom) ── -->
  <rect x="80" y="24" width="746" height="1052" fill="none" stroke="#FDFBF7" stroke-width="0.5" opacity="0.15"/>

  <!-- ── LOGO MARK — upper-left of content area ── -->
  <g transform="translate(98, 68) scale(1.5)" opacity="0.85">
    <circle cx="44" cy="44" r="42" fill="#FDFBF7" opacity="0.22"/>
    <circle cx="57" cy="44" r="33" fill="#1B2A4A"/>
    <circle cx="52" cy="44" r="36" fill="#FDFBF7" opacity="0.42"/>
    <circle cx="64" cy="44" r="26" fill="#1B2A4A"/>
    <circle cx="60" cy="44" r="28" fill="#FDFBF7" opacity="0.58"/>
    <circle cx="64" cy="44" r="23" fill="#1B2A4A"/>
    <circle cx="63" cy="44" r="21" fill="#FDFBF7" opacity="0.80"/>
  </g>

  <!-- ── TITLE BLOCK ── -->
  <!-- "HISTORY OF THE" — small descriptor above main title -->
  <text x="98" y="265"
        fill="#FDFBF7" font-size="13.5" letter-spacing="7"
        font-family="Georgia, serif" opacity="0.52">HISTORY OF THE</text>

  <!-- Main institutional title — three lines, large serif -->
  <text x="95" y="318"
        fill="#FDFBF7" font-size="46" font-weight="bold" letter-spacing="3.5"
        font-family="Georgia, serif" opacity="0.97">SAN DIEGO</text>
  <text x="95" y="398"
        fill="#FDFBF7" font-size="42" font-weight="bold" letter-spacing="2.5"
        font-family="Georgia, serif" opacity="0.97">PSYCHOANALYTIC</text>
  <text x="95" y="472"
        fill="#FDFBF7" font-size="46" font-weight="bold" letter-spacing="3.5"
        font-family="Georgia, serif" opacity="0.97">CENTER</text>

  <!-- ── PRIMARY DIVIDER RULE ── -->
  <line x1="95" y1="528" x2="806" y2="528" stroke="#FDFBF7" stroke-width="0.8" opacity="0.65"/>

  <!-- ── SUBTITLE ── -->
  <text x="95" y="560"
        fill="#FDFBF7" font-size="11.5" letter-spacing="3.2"
        font-family="Arial, sans-serif" opacity="0.60">A HALF-CENTURY OF CLINICAL, ACADEMIC,</text>
  <text x="95" y="581"
        fill="#FDFBF7" font-size="11.5" letter-spacing="3.2"
        font-family="Arial, sans-serif" opacity="0.60">AND COMMUNITY LEADERSHIP</text>

  <!-- ── YEAR RANGE ── -->
  <text x="95" y="650"
        fill="#FDFBF7" font-size="22" letter-spacing="10"
        font-family="Georgia, serif" opacity="0.32">1970</text>
  <line x1="188" y1="643" x2="248" y2="643" stroke="#FDFBF7" stroke-width="0.7" opacity="0.22"/>
  <text x="258" y="650"
        fill="#FDFBF7" font-size="22" letter-spacing="10"
        font-family="Georgia, serif" opacity="0.32">2026</text>

  <!-- ── SECONDARY THIN RULE ── -->
  <line x1="95" y1="682" x2="440" y2="682" stroke="#FDFBF7" stroke-width="0.4" opacity="0.14"/>

  <!-- ── PULL QUOTE (lower third) ── -->
  <text fill="#FDFBF7" font-size="11" font-style="italic"
        font-family="Georgia, serif" opacity="0.45" text-anchor="middle">
    <tspan x="453" y="850">&#x201C;We are held together by a shared sense of purpose,</tspan>
    <tspan x="453" dy="20">as well as a shared sense of humor&#x2026; ensuring that while</tspan>
    <tspan x="453" dy="20">we take our mission seriously, we never take ourselves</tspan>
    <tspan x="453" dy="20">too seriously.&#x201D;</tspan>
  </text>

  <!-- ── BOTTOM URL ── -->
  <text x="453" y="1042"
        fill="#FDFBF7" font-size="9" letter-spacing="3"
        text-anchor="middle" font-family="Arial, sans-serif" opacity="0.30">sdpsychoanalyticcenter.org</text>

  <!-- ── BOTTOM THIN RULE ── -->
  <line x1="95" y1="1055" x2="806" y2="1055" stroke="#FDFBF7" stroke-width="0.4" opacity="0.12"/>

</svg>
